build:
  name: Build Vega app
  steps:
    - eas/checkout
    - eas/install_node_modules
    - run:
        name: Install Vega Developer Tools
        command: |
          # NONINTERACTIVE skips the installer prompts. SKIP_VVD_INSTALL omits the
          # virtual device, which cannot run on a headless runner and is not needed
          # to build a package.
          export NONINTERACTIVE=true
          export SKIP_VVD_INSTALL=true
          if [[ "$EAS_BUILD_RUNNER" == "eas-build" ]]; then
            curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | bash
          else
            echo "Running locally; skip install of Vega tools"
          fi
          # `export` is step-local; set-env publishes PATH to every later step.
          set-env PATH "$HOME/vega/bin:$PATH"

    - run:
        name: Verify Vega SDK
        command: |
          vega --version
          vega sdk list-installed

    - eas/install_node_modules

    - run:
        name: Build debug vpkg
        command: |
          yarn run "build:debug"

    - run:
        name: Build release vpkg
        command: |
          yarn run "build:release"

    - run:
        name: Move artifacts to final location and archive them
        working_directory: ../..
        command: |
          mkdir vega_artifacts
          mv packages/vega/build/*release vega_artifacts
          mv packages/vega/build/*debug vega_artifacts
          tar zcf vega_artifacts.tgz vega_artifacts

    - eas/upload_artifact:
        name: Upload vpkg
        inputs:
          type: build-artifact
          path: vega_artifacts.tgz
